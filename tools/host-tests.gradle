// Loaded only by the explicit host-test entrypoint; no additional dependencies or lock changes.
import groovy.json.JsonOutput
import groovy.json.JsonSlurper

def registry = new JsonSlurper().parse(rootProject.file('tools/host-tests.json'))
def selected = providers.gradleProperty('pocketworldHostTests').get().split(',').toList()
if (selected.isEmpty() || selected.any { !registry.containsKey(it) }) {
    throw new GradleException('Choose registered host-test groups using tools/host-tests.py --list')
}
def entries = selected.collect { registry[it] }
def classes = entries.collectMany { [it['class']] + (it.additionalClasses ?: []) }.unique()
def sourceRoots = ['src/hostTest/java', 'src/test/java']
def kotlinSourceRoots = ['src/test/kotlin']
def sources = []
def kotlinSources = []
(classes + entries.collectMany { it.helpers }).unique().each { name ->
    def relative = name.replace('.', '/')
    def javaPath = relative + '.java'
    def kotlinPath = relative + '.kt'
    def javaCount = sourceRoots.count { file(it + '/' + javaPath).isFile() }
    def kotlinCount = kotlinSourceRoots.count { file(it + '/' + kotlinPath).isFile() }
    if (javaCount + kotlinCount != 1) {
        throw new GradleException('Expected one exact registered host-test source: ' + name)
    }
    if (javaCount == 1) sources.add(javaPath)
    else kotlinSources.add(kotlinPath)
}
// Do not compile the unrelated ordinary test matrix or all hostTest classes.
// The shared Android-compatible HTTP helper lives in src/test; exact includes
// below still exclude every unrelated ordinary test (and helper tests do not run).
android.sourceSets.test.java.setSrcDirs(sourceRoots)
android.sourceSets.test.java.setIncludes(sources as Set)
// Only the explicitly registered Kotlin classes enter the common test source set.
// Variant-specific and unrelated ordinary Compose/state roots remain excluded.
kotlin.sourceSets.matching { it.name in ['test', 'testDebug', 'testRelease'] }.configureEach {
    if (name == 'test' && !kotlinSources.isEmpty()) {
        kotlin.setSrcDirs(kotlinSourceRoots)
        kotlin.setIncludes(kotlinSources as Set)
    } else kotlin.setSrcDirs([])
}

tasks.withType(Test).configureEach {
    if (name != 'testDebugUnitTest') return
    filter {
        setFailOnNoMatchingTests(true)
        classes.each { includeTestsMatching(it) }
    }
    maxParallelForks = 1
    forkEvery = 1 // Isolate Android/real-JSON/native fixtures between selected classes.
    maxHeapSize = '1024m'
    // Robolectric's real document FD close needs the JDK17 java.io bridge; host JVM only.
    if (selected.contains('project-file-operations')) jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
    // The exact Linux/JDK17 attachment fixture uses real POSIX dup, not Robolectric's rw copy.
    if (selected.contains('attachment-legacy-integrity') || classes.contains('dev.pocketengine.features.attachments.LegacyAttachmentIntegrityTest')) {
        jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/sun.nio.fs=ALL-UNNAMED'
    }
    // SDK35 host Conscrypt inspects InetAddress on JDK17 for the real phone/OAuth TLS peers.
    // Open only this host-test JVM package; production TLS and certificate checks are unchanged.
    if (selected.contains('phone-task-platform') || classes.contains('dev.pocketengine.features.plugins.McpOAuthNativeRunnerJourneyTest')) {
        jvmArgs '--add-opens=java.base/java.net=ALL-UNNAMED'
    }
    enableAssertions = true
    outputs.upToDateWhen { false }
    // AGP's test_config.properties paths are app-module relative. A repository-root
    // cwd makes Robolectric look for app resources/APK under the wrong build/ tree.
    workingDir project.projectDir
    systemProperty 'pocket.gateway.source', rootProject.projectDir.absolutePath
    ['a25.python', 'a25.node', 'pocket.gateway.python', 'robolectric.dependency.dir', 'pocketworldHostLostWaitDir', 'pocketworldHostOldLostWaitDir', 'pocketworldHostTransportLostWaitDir'].each { key ->
        def value = providers.gradleProperty(key).orNull
        if (value != null) systemProperty key, value
    }
    if (providers.gradleProperty('robolectric.dependency.dir').isPresent()) systemProperty 'robolectric.offline', 'true'
    def library = providers.gradleProperty('pocketworldHostNativeDir').orNull
    if (library != null) systemProperty 'java.library.path', library
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full'; showStandardStreams = true }
    doFirst {
        // Explicit JNI subprocess fixtures use this same locked test closure, never a guessed JDK/App path.
        systemProperty 'pocketworldHostClasspath', classpath.asPath
        def report = file(providers.gradleProperty('pocketworldHostReport').get())
        report.mkdirs()
        new File(report, 'classpath.txt').text = classpath.files.collect { it.absolutePath }.join(System.lineSeparator()) + System.lineSeparator()
        new File(report, 'gradle-selection.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([
            groups: selected, classes: classes, sources: sources, sourceRoots: sourceRoots,
            kotlinSources: kotlinSources, kotlinSourceRoots: kotlinSourceRoots,
            dependencyLock: 'app/gradle.lockfile', testTask: path,
            workingDirectory: workingDir.absolutePath, gatewaySource: systemProperties['pocket.gateway.source'],
            junitXmlDirectory: reports.junitXml.outputLocation.get().asFile.absolutePath,
            junitXmlRequired: reports.junitXml.required.get(),
            jvmArguments: jvmArgs,
            assertions: true, deviceTest: false
        ])) + '\n'
    }
}

// AGP assigns its default report directory after tasks.withType(...).configureEach.
// This official callback runs after that assignment, before task inputs are read.
// Pin the fresh run directory rather than falling back to possibly stale default XML.
android.testOptions.unitTests.all({ Test unitTest ->
    if (unitTest.name != 'testDebugUnitTest') return
    def hostReport = file(providers.gradleProperty('pocketworldHostReport').get())
    def xml = unitTest.reports.junitXml
    xml.required.set(true)
    xml.outputLocation.set(new File(hostReport, 'junit'))
    xml.outputLocation.disallowChanges()
} as org.gradle.api.Action<Test>)
