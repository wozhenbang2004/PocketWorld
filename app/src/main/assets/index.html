<body>
<div class="app" id="app">
  <header class="header">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Pocket World · 口袋世界</span><small class="preview" id="previewFlag" hidden>原生服务未连接</small></div>
    <div class="header-tools"><button class="icon-button" id="capTrigger" aria-label="连接与能力">⋯</button><button class="model-trigger" id="modelTrigger" aria-label="模型与连接设置"><span id="modelName">配置模型</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button></div>
  </header>
  <div class="global-error" id="globalError" role="alert" hidden><span id="globalErrorText"></span><button id="dismissError" aria-label="收起错误提示">×</button></div>
  <section class="screen" id="chatScreen" aria-label="对话">
    <div class="scroll" id="chatScroll"><div id="chatContent"></div></div>
    <div class="composer-wrap">
      <div class="composer">
        <div class="composer-modes"><div class="home-mode-switch" aria-label="对话方式"><button id="phoneModeChoice" aria-pressed="true">操作手机</button><button id="chatModeChoice" aria-pressed="false">聊天</button></div><div class="execution-picker"><button id="executionChoice" aria-haspopup="true">主屏操作</button><div id="executionMenu" class="execution-menu" hidden><button id="chooseMainScreen">主屏操作<small>会占用当前屏幕</small></button><button id="chooseBackground">后台独立屏<small>需要先连接并建立副屏</small></button></div></div></div><textarea id="goalInput" rows="2" aria-label="手机任务目标" placeholder="告诉我，你想在手机上完成什么" maxlength="4000"></textarea>
        <div class="composer-bottom"><span class="composer-note" id="composerNote">主屏操作 · 会占用当前屏幕</span><div class="composer-send"><button class="speech-button" id="speechButton" aria-label="语音输入" aria-pressed="false">语音</button><button class="send-button" id="startButton"><span id="startLabel">开始操作</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 19V5m-5 5 5-5 5 5"/></svg></button></div></div>
      </div>
      <div class="input-error" id="inputError" role="status" hidden></div>
    </div>
  </section>
  <section class="screen" id="tasksScreen" aria-label="任务" hidden><div class="scroll"><div class="page-head"><div><h2>任务</h2><p>每一步操作，都可以回看。</p></div></div><div id="taskList"></div></div></section>
  <section class="screen" id="workspaceScreen" aria-label="工作区" hidden><div class="scroll"><div class="page-head"><div><h2>工作区</h2><p>任务留下的截图与结果。</p></div><button class="link-button" id="openProjects">项目文件</button></div><div id="workspaceContent"></div></div></section>
  <nav class="bottom-nav" aria-label="主导航">
    <button class="nav-button" data-tab="chat" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l-3 2V11.5A7.5 7.5 0 0 1 9.5 4h3a7.5 7.5 0 0 1 7.5 7.5Z"/><path d="M7.5 10h7m-7 4h4"/></svg><span>对话</span></button>
    <button class="nav-button" data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="5" y="4" width="15" height="17" rx="3"/><path d="M9 4V2m7 2V2M9 10h7m-7 5h5"/></svg><span>任务</span></button>
    <button class="nav-button" data-tab="workspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 8a3 3 0 0 1 3-3h4l2 2h6a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3Z"/><path d="M3 11h18"/></svg><span>工作区</span></button>
  </nav>

  <div class="shade" id="settingsShade" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="sheet-head"><h2 id="settingsTitle">模型与连接</h2><button class="icon-button" id="closeSettings" aria-label="关闭模型设置">×</button></header>
      <div class="sheet-body">
        <p class="sheet-intro">使用你自己的模型接口。手机操作需要模型支持工具调用；开启截图时还需支持图片理解。</p>
        <label class="field"><span class="field-label">接口地址</span><input id="baseUrl" type="url" inputmode="url" placeholder="https://api.example.com/v1" autocomplete="off" autocapitalize="none" spellcheck="false"><span class="field-hint" id="httpHint" hidden>这个地址使用 HTTP，任务数据将以明文传输。</span></label>
        <label class="field"><span class="field-label">模型名称</span><input id="model" type="text" placeholder="填写接口支持的模型名称" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
        <label class="field"><span class="field-label">API 密钥</span><span class="key-input"><input id="apiKey" type="password" placeholder="粘贴 API 密钥" autocomplete="off" autocapitalize="none" spellcheck="false"><button id="toggleKey" type="button" aria-label="显示密钥"></button></span><span class="field-hint" id="keyHint">密钥保存在手机的私有存储中。</span><button type="button" class="clear-key" id="clearKey" hidden>清除已保存的密钥</button></label>
        <div class="switch-row"><div class="switch-copy"><p>将屏幕截图提供给模型</p><small>关闭后仅使用可见界面文字与节点。</small></div><button class="switch" role="switch" aria-checked="true" id="sendScreenshots" aria-label="将屏幕截图提供给模型"><span></span></button></div>
        <details><summary>高级设置</summary><div class="advanced-fields"><label class="field"><span class="field-label">最多操作步数</span><input id="maxSteps" type="number" inputmode="numeric" min="1" max="40" value="20"></label><label class="field"><span class="field-label">请求超时（秒）</span><input id="timeout" type="number" inputmode="numeric" min="10" max="120" value="60"></label></div><span class="field-hint">达到上限后停止后续操作，已完成的步骤会保留。</span></details>
        <div class="inline-result" id="settingsResult" role="status" hidden></div>
      </div>
      <footer class="sheet-footer"><button class="button secondary" id="testButton">测试连接</button><button class="button primary" id="saveButton">保存并使用</button></footer>
    </section>
  </div>

  <div class="shade" id="permissionShade" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="permissionTitle">
      <header class="sheet-head"><h2 id="permissionTitle">准备操作主屏</h2><button class="icon-button" id="closePermission" aria-label="关闭操作准备">×</button></header>
      <div class="sheet-body"><p class="sheet-intro" id="consentCopy"></p><div id="permissionRows"></div><div class="inline-result" id="permissionResult" hidden role="status"></div></div>
      <footer class="sheet-footer"><button class="button secondary" id="cancelPermission">先不操作</button><button class="button primary" id="acceptPermission">我已了解，开始操作</button></footer>
    </section>
  </div>

  <div class="shade" id="taskShade" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="taskTitle">
      <header class="sheet-head"><h2 id="taskTitle">任务详情</h2><button class="icon-button" id="closeTask" aria-label="关闭任务详情">×</button></header>
      <div class="sheet-body" id="taskBody"></div>
    </section>
  </div>
  <div class="shade zoom" id="imageShade" hidden role="dialog" aria-modal="true" aria-label="截图预览"><button class="icon-button zoom-close" id="closeImage" aria-label="关闭截图">×</button><img id="zoomImage" alt="任务结果截图"><p id="zoomCaption"></p></div>
  <div class="shade cap-shade" id="capShade" hidden><section class="sheet cap-sheet" role="dialog" aria-modal="true" aria-labelledby="capTitle"><header class="sheet-head"><button class="icon-button" id="capBack" aria-label="关闭连接与能力">×</button><h2 id="capTitle">连接与能力</h2><button class="link-button" id="capRefresh">刷新</button></header><div class="sheet-body" id="capBody"></div></section></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id);
  const state={config:{baseUrl:'',model:'',hasApiKey:false,sendScreenshots:true,maxSteps:20,requestTimeoutSeconds:60},accessibilityEnabled:false,notificationsEnabled:false,tasks:[],activeTaskId:null};
  const activeStatuses=new Set(['preparing','running','pausing','paused','resuming','verifying','cancelling','stopping']);
  const statusLabels={preparing:'准备中',running:'运行中',pausing:'正在暂停',paused:'已暂停',resuming:'正在继续',verifying:'核验中',needs_confirmation:'请确认结果',awaiting_user:'等待你处理',waiting_user:'等待你处理',completed:'已完成',failed:'未完成',cancelled:'已停止',canceled:'已停止',stopped:'已停止',interrupted:'已中断',cancelling:'正在停止',stopping:'正在停止'};
  const paths={phone:['M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z','M10 17h4'],arrow:['m9 5 7 7-7 7'],launch:['M14 4h6v6','m11 13 9-9','M20 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4'],calculator:['M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z','M8 7h8M8 12h1m6 0h1M8 16h1m6 0h1'],settings:['M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z','M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2'],pause:['M8 5v14M16 5v14'],play:['m8 5 11 7-11 7Z'],stop:['M6 6h12v12H6Z'],check:['m5 12 4 4L19 6'],file:['M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z','M14 3v6h5M8 13h8m-8 4h5'],bell:['M6 8a6 6 0 0 1 12 0v6l2 3H4l2-3Z','M10 21h4'],shield:['m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z','m8 12 3 3 5-6'],eye:['M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z','M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z'],image:['M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z','m3 16 6-6 12 11M15 7h.01'],task:['M6 4h12a2 2 0 0 1 2 2v14H4V6a2 2 0 0 1 2-2Z','M8 9h8m-8 5h5'],back:['m14 6-6 6 6 6']};
  const toolLabels={phone_observe:'观察当前屏幕',phone_list_apps:'查找手机应用',phone_launch_app:'打开应用',phone_click_node:'点击界面控件',phone_tap:'点击屏幕',phone_type:'输入文字',phone_swipe:'滑动屏幕',phone_back:'返回上一页',phone_home:'返回桌面',phone_wait:'等待页面变化',phone_request_user:'等待你接管'};
  let tab='chat',selectedTaskId=null,settingsDirty=false,clearApiKey=false,pendingSave=null,pendingGoal='',pendingStarting=false,testing=false,logsOpen=false,technicalOpen=false,toastTimer=null,workspaceLimit=6;
  const feedbackDrafts=new Map(),feedbackExpanded=new Set(),sheetFocus=new Map(),sheetStack=[],requestedEvidence=new Set(),pendingEvidence=new Set();
  const nativeAvailable=()=>!!(window.Native&&typeof window.Native.postMessage==='function');
  function node(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=String(text);return n;}
  function icon(name){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','1.7');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');(paths[name]||paths.phone).forEach(d=>{const p=document.createElementNS(s.namespaceURI,'path');p.setAttribute('d',d);s.append(p);});return s;}
  function button(text,variant,fn,ico){const b=node('button','button '+(variant||''));if(ico)b.append(icon(ico));b.append(node('span','',text));b.addEventListener('click',fn);return b;}
  function send(action,payload){if(!nativeAvailable()){showToast('当前页面未连接手机原生服务，请在完整应用中使用手机能力。');return false;}try{window.Native.postMessage(JSON.stringify(Object.assign({action},payload||{})));return true;}catch(err){showError('无法连接手机执行服务，请重新打开应用。');return false;}}
  function showToast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3000);}
  function showError(message){$('globalErrorText').textContent=message||'发生错误，请重试。';$('globalError').hidden=false;pendingStarting=false;setBusy();}
  function setInputError(message){$('inputError').textContent=message;$('inputError').hidden=!message;}
  function displayTime(value){if(!value)return '';const d=new Date(typeof value==='number'||/^\d+$/.test(String(value))?Number(value):value);if(Number.isNaN(d.getTime()))return '';return new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);}
  function taskTime(t){return t.updatedAt||t.createdAt||0;}
  function timestamp(value){return typeof value==='number'||/^\d+$/.test(String(value))?Number(value):Date.parse(value)||0;}
  function tasks(){return state.tasks.slice().sort((a,b)=>timestamp(taskTime(b))-timestamp(taskTime(a)));}
  function mergeTask(old,next){const t=Object.assign({},old||{},next),e=next.evidence===undefined?(old&&old.evidence)||{}:Object.assign({},next.evidence);if(!imageUrl(e)&&old&&old.evidence&&e.imageFile&&e.imageFile===old.evidence.imageFile&&imageUrl(old.evidence))e.imageDataUrl=old.evidence.imageDataUrl;t.evidence=e;return t;}
  function phoneTask(t){return !t.kind||t.kind==='phone';}
  function activeTask(){return state.tasks.find(t=>phoneTask(t)&&t.id===state.activeTaskId)||state.tasks.find(t=>phoneTask(t)&&activeStatuses.has(t.status))||null;}
  function statusNode(value){const s=node('span','status '+(value||''));s.append(node('i','status-dot'));s.append(node('span','',statusLabels[value]||'状态更新中'));return s;}
  function latestMessage(task){const events=Array.isArray(task.events)?task.events:[];const last=events[events.length-1];const recent=last&&(last.message||toolLabels[last.tool]||last.status&&statusLabels[last.status]);return (activeStatuses.has(task.status)?recent||task.summary:task.summary||recent)||'任务记录已保存。';}
  function imageUrl(evidence){const url=evidence&&evidence.imageDataUrl;return typeof url==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=\s]+$/.test(url)?url:null;}
  function safeJson(value){return JSON.stringify(value,(key,v)=>{if(/api.?key|authorization|credential|token|imageBase64|imageDataUrl/i.test(key))return '[已隐藏]';if(typeof v==='string'&&v.length>1800)return v.slice(0,1800)+'…';return v;},2);}
  function setTab(next){tab=next;['chat','tasks','workspace'].forEach(x=>$(x+'Screen').hidden=x!==next);document.querySelectorAll('[data-tab]').forEach(b=>{if(b.dataset.tab===next)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});render();}
  function setBusy(){const a=activeTask();$('startButton').disabled=!!a||pendingStarting;$('startLabel').textContent=pendingStarting?'准备中':a?'任务进行中':'开始操作';$('composerNote').textContent=a?'正在操作主屏 · 暂停后可接管':'主屏操作 · 会占用当前屏幕';}
  function renderChat(){const host=$('chatContent');host.replaceChildren();const list=tasks().filter(phoneTask),a=activeTask();if(!list.length){const w=node('div','welcome'),m=node('div','emblem');m.append(icon('phone'));w.append(m,node('h1','','你说目标，我来操作。'),node('p','','连接后台独立屏后，替你打开应用、点击和输入，完成后给你看结果。'));const sg=node('div','suggestions');[['calculator','打开计算器，算一下 128 × 36'],['settings','打开设置，看看当前电量']].forEach(([ico,text])=>{const b=node('button','suggestion');b.append(icon(ico),node('span','',text));const ar=icon('arrow');ar.classList.add('arrow');b.append(ar);b.onclick=()=>{$('goalInput').value=text;resizeGoal();$('goalInput').focus();};sg.append(b);});w.append(sg);host.append(w);return;}
    const target=a||list[0];host.append(node('div','conversation-goal',target.goal||'手机任务'));const card=node('div','run-card');card.append(statusNode(target.status),node('h3','',latestMessage(target)));if(a)card.append(node('p','latest',a.status==='paused'?'任务已暂停，继续时会重新观察当前页面。':a.executionMode==='background'?'任务正在后台独立屏执行，你可以继续使用主屏。':'主屏正在被任务使用。暂停后可以手动接管。'));const actions=node('div','card-actions');if(a){if(a.status==='paused')actions.append(button('继续','secondary',()=>runAction('resumeRun'),'play'));else if(!['stopping','cancelling'].includes(a.status))actions.append(button('暂停','secondary',()=>runAction('pauseRun'),'pause'));actions.append(button('停止','line',()=>runAction('stopRun'),'stop'));}else if(target.status==='needs_confirmation')actions.append(button('查看并确认','primary',()=>openTask(target.id),'check'));actions.append(button('查看任务','line',()=>openTask(target.id)));card.append(actions);host.append(card);if(list.length>1){const label=node('div','section-label','之前的任务');const all=node('button','link-button','查看全部');all.onclick=()=>setTab('tasks');label.append(all);host.append(label);list.filter(t=>t.id!==target.id).slice(0,3).forEach(t=>host.append(taskRow(t)));}}
  function taskRow(t){const b=node('button','task-row'),main=node('div','row-main'),meta=node('div','row-meta');main.append(node('h3','',t.goal||'任务'));meta.append(node('span','',({phone:'手机',teams:'团队',remote:'电脑',plugins:'工具'}[t.kind]||'手机')));meta.append(statusNode(t.status),node('span','',displayTime(taskTime(t))));main.append(meta);b.append(main,icon('arrow'));b.onclick=()=>openTask(t.id);return b;}

$('phoneModeChoice').onclick=()=>{chatMode=false;previousReceive({type:'state',payload:{}});renderHomeMode();};$('chatModeChoice').onclick=()=>{chatMode=true;renderHomeMode();if(!chatMessages.length)request('assistant','list',{}).then(res=>{cache.conversations=listOf(res,'conversations');}).catch(()=>{});};
$('executionChoice').onclick=()=>{const choice=$('executionMenu');choice.hidden=!choice.hidden;};$('chooseMainScreen').onclick=()=>{phoneMode='main_screen';$('executionMenu').hidden=true;renderHomeMode();};$('chooseBackground').onclick=()=>{phoneMode='background';$('executionMenu').hidden=true;renderHomeMode();if(!displayReady())openCenter('display');};
$('speechButton').onclick=()=>native(media.listening?'stopListening':'startListening');const originalStart=$('startButton').onclick;$('startButton').onclick=()=>{if(chatMode)sendChat();else if(phoneMode==='background'&&!displayReady())openCenter('display');else originalStart();};$('openProjects').onclick=()=>openCenter('workspace');
window.addEventListener('focus',()=>{refresh();native('getMediaState');});document.addEventListener('keydown',e=>{if(!centerOpen)return;if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();if(confirmation){confirmation(false);return;}if(activeFeature){activeFeature='';renderCenter();}else closeCenter();return;}if(e.key==='Tab'){const items=Array.from(($('capConfirm')||$('capShade')).querySelectorAll('button:not([disabled]),input,textarea,select,summary')).filter(n=>n.getClientRects().length),first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||!($('capConfirm')||$('capShade')).contains(document.activeElement))){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}},true);
renderHomeMode();if(window.Native){refresh();native('getMediaState');}
