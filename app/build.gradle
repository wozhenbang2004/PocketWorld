plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
    namespace 'dev.pocketengine'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'dev.pocketengine'
        minSdk 30
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
        versionCode 3
        versionName '0.3.0-dev'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests { includeAndroidResources = true } }
    lint { abortOnError true }
    externalNativeBuild {
        cmake {
            path file('src/main/java/dev/pocketengine/features/local/runtime/native/CMakeLists.txt')
            version '3.31.6'
        }
    }
    packaging {
        resources {
            // JVM OSGi descriptors are not Android resources; both JSch and jspecify ship this path.
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
        jniLibs {
            // These two .so-named files are execve payloads, not dlopen libraries.
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libproot.so', '**/libloader.so']
        }
    }
}
dependencyLocking { lockAllConfigurations() }
def helperTask = tasks.register('buildDisplayHelper', Exec) {
    inputs.dir(rootProject.file('display-helper/src'))
    inputs.file('src/main/java/dev/pocketengine/phone/display/DisplayWire.java')
    inputs.file(rootProject.file('tools/build-display-helper.sh'))
    outputs.file(layout.buildDirectory.file('generated/display-helper-assets/pocketengine-display-helper.jar'))
    commandLine 'bash', rootProject.file('tools/build-display-helper.sh').absolutePath, layout.buildDirectory.file('generated/display-helper-assets/pocketengine-display-helper.jar').get().asFile.absolutePath
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/display-helper-assets'))
tasks.named('preBuild').configure { dependsOn helperTask }
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.86'
    constraints {
        implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
        implementation 'org.bouncycastle:bcutil-jdk15to18:1.86'
    }
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'io.livekit:livekit-android:2.29.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.1'
    // Native local QR encoding only. Never upload a login challenge to an encoder service.
    implementation('com.google.zxing:core:3.5.4') { version { strictly '3.5.4' } }
    implementation 'org.jsoup:jsoup:1.23.2'
    // Bounded untrusted project regex; never fall back to java.util.regex backtracking.
    implementation('com.google.re2j:re2j:1.8') { version { strictly '1.8' } }
    implementation 'androidx.javascriptengine:javascriptengine:1.1.1'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
android.sourceSets.main.java.srcDir(rootProject.file('display-helper/src'))

// Only the reviewed Java source/test directories: never draft docs or downloaded binaries.
android.sourceSets.main.java.srcDir('src/pendingAdb/java')
android.sourceSets.test.java.srcDir('src/pendingAdb/test')
// Android JNI stays in the APK; host tests retain Robolectric's OpenJDK provider.
configurations.matching { it.name.endsWith('UnitTestRuntimeClasspath') }.configureEach {
    exclude group: 'org.conscrypt', module: 'conscrypt-android'
}
// Robolectric's alternate BC packaging duplicates the production provider classes.
configurations.matching { it.name.endsWith('UnitTestCompileClasspath') || it.name.endsWith('UnitTestRuntimeClasspath') }.configureEach {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
}

// Build pinned official PRoot sources before packaging. Never execute downloaded ARM64 code here.
def runtimeNativeOutput = layout.buildDirectory.dir('generated/android-runtime')
def runtimeNativeTask = tasks.register('buildAndroidRuntime', Exec) {
    inputs.file(rootProject.file('tools/build-android-runtime.py'))
    inputs.dir('src/main/java/dev/pocketengine/features/local/runtime/native')
    inputs.file('src/main/assets/runtime/catalog.json')
    outputs.dir(runtimeNativeOutput.map { it.dir('jniLibs') })
    doFirst {
        // AGP 8.7's SDK-component provider queries an absent optional ndkPath.
        // The pinned plugin's Android extension resolves the same configured NDK directly.
        def nativeArgs = ['python3', rootProject.file('tools/build-android-runtime.py').absolutePath,
                '--ndk', android.ndkDirectory.absolutePath,
                '--output', runtimeNativeOutput.get().asFile.absolutePath]
        if (gradle.startParameter.offline) nativeArgs += '--offline'
        def sourceCache = providers.gradleProperty('pocketworldRuntimeSourceCache').orNull
        if (sourceCache != null) nativeArgs += ['--cache', rootProject.file(sourceCache).absolutePath]
        commandLine nativeArgs
    }
}
android.sourceSets.main.jniLibs.srcDir(runtimeNativeOutput.map { it.dir('jniLibs') })
tasks.named('preBuild').configure { dependsOn runtimeNativeTask }

// Opt-in source/fixture registration only; ordinary unit tests and APK builds are unchanged.
if (providers.gradleProperty('pocketworldHostTests').isPresent()) {
    apply from: rootProject.file('tools/host-tests.gradle')
}
