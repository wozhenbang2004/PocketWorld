plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }

// The existing APK workflow supplies its own increasing run number. Other CI/release
// chains must assign BOTH properties; an explicit release code must exceed every
// already distributed code. A workflow-local run number cannot order those releases.
def pocketworldVersionScript = rootProject.layout.projectDirectory.file('tools/app-version.py')
def pocketworldPython = providers.gradleProperty('pocketworldPython').getOrElse('python3')
def pocketworldVersionCommand = [pocketworldPython, pocketworldVersionScript.asFile.absolutePath]
['pocketworldVersionCode': '--version-code', 'pocketworldVersionName': '--version-name'].each { key, flag ->
    def value = providers.gradleProperty(key)
    if (value.isPresent()) pocketworldVersionCommand += [flag, value.get()]
}
// Also track resolver edits when Gradle's configuration cache is enabled.
providers.fileContents(pocketworldVersionScript).asText.get()
def pocketworldVersionProcess = providers.exec {
    commandLine pocketworldVersionCommand
    ignoreExitValue true
}
if (pocketworldVersionProcess.result.get().exitValue != 0) {
    throw new GradleException(pocketworldVersionProcess.standardError.asText.get().trim())
}
def pocketworldVersion = new groovy.json.JsonSlurper().parseText(pocketworldVersionProcess.standardOutput.asText.get())
// Optional private self-update service. No endpoint or credentials are shipped by default.
def updateManifestUrl = providers.gradleProperty('pocketworldUpdateManifestUrl').getOrElse('')
def updatePublicKey = providers.gradleProperty('pocketworldUpdatePublicKey').getOrElse('')
if (updateManifestUrl.isEmpty() != updatePublicKey.isEmpty()) throw new GradleException('Set both private update URL and pinned RSA public key')
if (!updateManifestUrl.isEmpty()) {
    try {
        def updateUri = new URI(updateManifestUrl)
        if (updateUri.scheme != 'https' || updateUri.host == null || updateUri.userInfo != null || updateUri.fragment != null || updateUri.query != null)
            throw new IllegalArgumentException('Invalid private update URL')
        if (!(updatePublicKey ==~ /[A-Za-z0-9+\/=]{256,6000}/)) throw new IllegalArgumentException('Invalid public key encoding')
        // A format-looking base64 string may be a PRIVATE key. Parse SPKI before
        // embedding anything in resources, so an operator mistake cannot leak it.
        def publicKey = java.security.KeyFactory.getInstance('RSA').generatePublic(
                new java.security.spec.X509EncodedKeySpec(java.util.Base64.decoder.decode(updatePublicKey)))
        if (!(publicKey instanceof java.security.interfaces.RSAPublicKey) || publicKey.modulus.bitLength() < 2048 || publicKey.modulus.bitLength() > 8192)
            throw new IllegalArgumentException('Invalid public key strength')
    } catch (Exception invalidUpdateConfiguration) {
        throw new GradleException('Private update configuration requires HTTPS without embedded credentials and a base64 RSA SPKI PUBLIC key (2048-8192 bits); values were not embedded')
    }
}
// Opt-in source distribution only. Does not enroll a device or include Firebase.
def unifiedPushEnabled = providers.gradleProperty('pocketworldUnifiedPush').getOrElse('false') == 'true'
android {
    namespace 'dev.pocketengine'
    compileSdk (unifiedPushEnabled ? 36 : 35)
    buildToolsVersion '35.0.0'
    ndkVersion '28.2.13676358'
    if (providers.gradleProperty('pocketworldNdkPath').isPresent()) ndkPath providers.gradleProperty('pocketworldNdkPath').get()
    defaultConfig {
        applicationId 'dev.pocketengine'
        minSdk 30
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
        versionCode pocketworldVersion.versionCode
        versionName pocketworldVersion.versionName
        resValue 'string', 'pocketworld_update_manifest_url', updateManifestUrl
        resValue 'string', 'pocketworld_update_public_key', updatePublicKey
        resValue 'bool', 'pocketworld_unified_push', unifiedPushEnabled.toString()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests { includeAndroidResources = true } }
    lint { abortOnError true }
    externalNativeBuild {
        cmake {
            path file('src/main/java/dev/pocketengine/features/local/runtime/native/CMakeLists.txt')
            version '3.31.6'
        }
    }
    packaging {
        resources {
            // JVM OSGi descriptors are not Android resources; both JSch and jspecify ship this path.
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
        jniLibs {
            // These two .so-named files are execve payloads, not dlopen libraries.
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libproot.so', '**/libloader.so']
        }
    }
}
android.sourceSets.main.java.srcDir(unifiedPushEnabled ? 'src/unifiedPush/java' : 'src/noUnifiedPush/java')
if (unifiedPushEnabled) {
    dependencies { implementation 'org.unifiedpush.android:connector:3.3.5' }
}
dependencyLocking { lockAllConfigurations() }
def helperTask = tasks.register('buildDisplayHelper', Exec) {
    inputs.dir(rootProject.file('display-helper/src'))
    inputs.file('src/main/java/dev/pocketengine/phone/display/DisplayWire.java')
    inputs.file('src/main/java/dev/pocketengine/phone/display/PhoneParallelCapabilities.java')
    inputs.file(rootProject.file('tools/build-display-helper.sh'))
    outputs.file(layout.buildDirectory.file('generated/display-helper-assets/pocketengine-display-helper.jar'))
    commandLine providers.gradleProperty('pocketworldBash').getOrElse('bash'),
            rootProject.file('tools/build-display-helper.sh').absolutePath.replace('\\', '/'),
            layout.buildDirectory.file('generated/display-helper-assets/pocketengine-display-helper.jar').get().asFile.absolutePath.replace('\\', '/')
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/display-helper-assets'))
// Official, fixed Apache-2.0 streaming applier only. Generator remains an offline release tool.
android.sourceSets.main.java.srcDir(rootProject.file('third-party/archive-patcher/applier/src/main/java'))
tasks.named('preBuild').configure { dependsOn helperTask }
def libraryWebTask = tasks.register('verifyLibraryWebBundle', Exec) {
    inputs.dir('src/main/assets/pocket-ui')
    inputs.file(rootProject.file('web-ui/scripts/verify-build-receipt.mjs'))
    commandLine 'node', rootProject.file('web-ui/scripts/verify-build-receipt.mjs').absolutePath,
            file('src/main/assets/pocket-ui').absolutePath
}
tasks.named('preBuild').configure { dependsOn libraryWebTask }
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.86'
    constraints {
        implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
        implementation 'org.bouncycastle:bcutil-jdk15to18:1.86'
    }
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'io.livekit:livekit-android:2.29.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.1'
    // Native local QR encoding only. Never upload a login challenge to an encoder service.
    implementation('com.google.zxing:core:3.5.4') { version { strictly '3.5.4' } }
    implementation 'org.jsoup:jsoup:1.23.2'
    // Bounded untrusted project regex; never fall back to java.util.regex backtracking.
    implementation('com.google.re2j:re2j:1.8') { version { strictly '1.8' } }
    // Owner-reviewed MCP resource URI expansion only; the adapter rejects unsupported forms.
    implementation('com.damnhandy:handy-uri-templates:2.1.8') { version { strictly '2.1.8' } }
    implementation 'androidx.javascriptengine:javascriptengine:1.1.1'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
android.sourceSets.main.java.srcDir(rootProject.file('display-helper/src'))

// Only the reviewed Java source/test directories: never draft docs or downloaded binaries.
android.sourceSets.main.java.srcDir('src/pendingAdb/java')
android.sourceSets.test.java.srcDir('src/pendingAdb/test')
// Android JNI stays in the APK; host tests retain Robolectric's OpenJDK provider.
configurations.matching { it.name.endsWith('UnitTestRuntimeClasspath') }.configureEach {
    exclude group: 'org.conscrypt', module: 'conscrypt-android'
}
// Robolectric's alternate BC packaging duplicates the production provider classes.
configurations.matching { it.name.endsWith('UnitTestCompileClasspath') || it.name.endsWith('UnitTestRuntimeClasspath') }.configureEach {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
}

// Build pinned official PRoot sources before packaging. Never execute downloaded ARM64 code here.
def runtimeNativeOutput = layout.buildDirectory.dir('generated/android-runtime')
def runtimeNativeTask = tasks.register('buildAndroidRuntime', Exec) {
    inputs.file(rootProject.file('tools/build-android-runtime.py'))
    inputs.file(rootProject.file('tools/build-android-runtime-wsl.ps1'))
    inputs.dir('src/main/java/dev/pocketengine/features/local/runtime/native')
    inputs.file('src/main/assets/runtime/catalog.json')
    outputs.dir(runtimeNativeOutput.map { it.dir('jniLibs') })
    outputs.file(runtimeNativeOutput.map { it.file('native-build-receipt.json') })
    doFirst {
        // AGP 8.7's SDK-component provider queries an absent optional ndkPath.
        // The pinned plugin's Android extension resolves the same configured NDK directly.
        def nativeArgs = [pocketworldPython, rootProject.file('tools/build-android-runtime.py').absolutePath,
                '--ndk', android.ndkDirectory.absolutePath,
                '--output', runtimeNativeOutput.get().asFile.absolutePath]
        if (gradle.startParameter.offline) nativeArgs += '--offline'
        def sourceCache = providers.gradleProperty('pocketworldRuntimeSourceCache').orNull
        if (sourceCache != null) nativeArgs += ['--cache', rootProject.file(sourceCache).absolutePath]
        if (System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('windows')) {
            def distro = providers.gradleProperty('pocketworldWslDistribution').orNull
            def linuxNdk = providers.gradleProperty('pocketworldWslNdk').orNull
            if (!distro || !linuxNdk) throw new GradleException('Windows PRoot build requires pocketworldWslDistribution and pocketworldWslNdk; Java/Kotlin and normal JNI remain on Windows')
            def bridge = ['powershell.exe', '-NoProfile', '-File', rootProject.file('tools/build-android-runtime-wsl.ps1').absolutePath,
                          '-SourceRoot', rootProject.projectDir.absolutePath, '-Output', runtimeNativeOutput.get().asFile.absolutePath,
                          '-Distribution', distro, '-Ndk', linuxNdk]
            if (sourceCache != null) bridge += ['-SourceCache', rootProject.file(sourceCache).absolutePath]
            if (gradle.startParameter.offline) bridge += ['-Offline']
            commandLine bridge
        } else {
            commandLine nativeArgs
        }
    }
}
android.sourceSets.main.jniLibs.srcDir(runtimeNativeOutput.map { it.dir('jniLibs') })
tasks.named('preBuild').configure { dependsOn runtimeNativeTask }

// Opt-in source/fixture registration only; ordinary unit tests and APK builds are unchanged.
if (providers.gradleProperty('pocketworldHostTests').isPresent()) {
    apply from: rootProject.file('tools/host-tests.gradle')
}
