name: Phone control workbench
on:
  push:
    branches: [work/phone-control-reliability-20261109]
    paths:
      - .github/workflows/phone-control-workbench.yml
      - tools/ci/phone-control-workbench.py
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture tracked source and reference revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phone-control-sources/pocketworld"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/phone-control-sources/pocketworld"
          git rev-parse HEAD > "$RUNNER_TEMP/phone-control-sources/pocketworld-revision.txt"
          git clone --depth 1 --filter=blob:none https://github.com/wangzan101/Mika.git "$RUNNER_TEMP/mika-reference"
          git clone --depth 1 --filter=blob:none https://github.com/ccch1mneyyy/dsh-Go.git "$RUNNER_TEMP/dsh-reference"
          for name in mika dsh; do
            mkdir -p "$RUNNER_TEMP/phone-control-sources/$name"
            git -C "$RUNNER_TEMP/$name-reference" rev-parse HEAD > "$RUNNER_TEMP/phone-control-sources/$name-revision.txt"
            git -C "$RUNNER_TEMP/$name-reference" archive HEAD | tar -x -C "$RUNNER_TEMP/phone-control-sources/$name"
          done
          python3 - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'phone-control-sources'
          allowed = {'.java','.kt','.kts','.gradle','.json','.xml','.properties','.md','.yml','.yaml','.py','.sh','.ts','.tsx','.mjs','.aidl','.c','.h','.cpp','.bat'}
          with zipfile.ZipFile('phone-control-sources.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and not any(x in p.parts for x in ('.git','node_modules')) and (p.suffix in allowed or p.name.endswith('-revision.txt') or p.name in ('gradlew','LICENSE','NOTICE')):
                      archive.write(p,p.relative_to(root))
          print('Source snapshot bytes:', pathlib.Path('phone-control-sources.zip').stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phone-control-source-snapshot
          path: phone-control-sources.zip
          retention-days: 2
          if-no-files-found: error
