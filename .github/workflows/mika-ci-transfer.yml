name: Mika source recovery and focused CI
on:
  push:
    branches: [work/mika-53-ci-transfer-20261102]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mika-source-transfer
  cancel-in-progress: false
jobs:
  import:
    if: ${{ github.event.repository.private && github.ref == 'refs/heads/work/mika-53-ci-transfer-20261102' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.import.outputs.source }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Verify and fast-forward only the authorized work branch
        id: import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, pathlib
          m=json.loads(pathlib.Path('transfer/manifest.json').read_text())
          assert m['source_commit']=='1095b67d62d4964525137942d1048107f2d7b652'
          assert m['source_tree']=='7221e17d2a82d40b102b98061f2e0cd00e898c3d'
          assert m['base']=='886a28d071cd6d8e5977c8c001716230f8e42faf'
          assert m['target_branch']=='work/mika-53-capabilities-20261102'
          assert len(m['parts'])==2
          content=[]
          for i,p in enumerate(m['parts']):
              assert p['path']==f'transfer/part-{i:03d}.b64'
              b=pathlib.Path(p['path']).read_bytes()
              assert len(b)==p['size'] and hashlib.sha256(b).hexdigest()==p['sha256']
              content.append(b)
          bundle=base64.b64decode(b''.join(content), validate=True)
          assert len(bundle)==35979
          assert hashlib.sha256(bundle).hexdigest()=='647a92a28df34f6ec46bd53852a722349e1118154a7b35260b4ea0a4e7eafb0e'
          pathlib.Path('/tmp/pocketworld-mika.bundle').write_bytes(bundle)
          PY
          source_commit=1095b67d62d4964525137942d1048107f2d7b652
          source_tree=7221e17d2a82d40b102b98061f2e0cd00e898c3d
          expected_base=886a28d071cd6d8e5977c8c001716230f8e42faf
          target_branch=work/mika-53-capabilities-20261102
          git bundle verify /tmp/pocketworld-mika.bundle
          git fetch /tmp/pocketworld-mika.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$source_commit"
          test "$(git rev-parse "$source_commit^{tree}")" = "$source_tree"
          git merge-base --is-ancestor 886a28d071cd6d8e5977c8c001716230f8e42faf "$source_commit"
          git diff --exit-code 63a8af6acdd6d9f70909cae43454416ca0a896dd "$source_commit" -- \
            ':(glob)**/DeviceCapabilityPort.java' ':(glob)**/DeviceWorkspaceArtifacts.java' \
            ':(glob)**/TaskStoreDeviceTasks.java'
          python3 - "$source_commit" <<'PYGUARD'
          import pathlib,subprocess,sys
          path='app/src/main/java/dev/pocketengine/features/devices/DeviceWorkspaceNativeOwner.java'
          original=subprocess.check_output(['git','show','63a8af6acdd6d9f70909cae43454416ca0a896dd:'+path],text=True)
          current=subprocess.check_output(['git','show',sys.argv[1]+':'+path],text=True)
          allowed=[
              '        public DeviceOwnerInputs ordinaryInputs(){return app.deviceOwnerInputs();}\n',
              '        public void ordinaryInputAccepted(DeviceOwnerInputs.Scope original,JSONObject accepted)throws Exception{app.deviceOwnerInputAccepted(original,accepted);}\n',
              '        if(goal)capabilities.put("task.answerQuestion").put("task.steer");\n'
          ]
          for addition in allowed:
              assert current.count(addition)==1, 'Unexpected ordinary-input native adapter'
              current=current.replace(addition,'',1)
          assert current==original, 'Protected native attachment factory or unrelated owner code changed'
          PYGUARD
          actual=$(git ls-remote origin "refs/heads/$target_branch" | cut -f1)
          test "$actual" = "$expected_base"
          target_commit=$(printf '%s\n' 'Merge verified Mika capability source with the scoped CI definition' | git -c user.name='PocketWorld CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$source_tree" -p "$source_commit" -p "$expected_base")
          git merge-base --is-ancestor "$expected_base" "$target_commit"
          git diff --exit-code "$expected_base" "$target_commit" -- .github/workflows
          git push origin "$target_commit:refs/heads/$target_branch"
          echo "source=$target_commit" >> "$GITHUB_OUTPUT"
          echo "Imported source commits through $source_commit; exact tree: $source_tree; merge: $target_commit" >> "$GITHUB_STEP_SUMMARY"
  targeted:
    needs: import
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.import.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the declared Android compilation platform
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Test the exact imported capability source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '${{ needs.import.outputs.source }}'
          bash tools/run-mika-focused.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mika-focused-test-results-${{ needs.import.outputs.source }}
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
