name: Build private debug APK
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'host-tests' && format('Host tests · {0}', inputs.host_group) || 'Debug APK' }} · ${{ github.ref_name }} · ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build an APK, or run one selected host integration group (no APK)'
        type: choice
        default: apk
        options: [apk, host-tests]
      host_group:
        description: 'Used only for target=host-tests; deliberately no full-suite option'
        type: choice
        default: device-receiver
        options: [project-file-operations, project-file-search, browser-expression, device-receiver, managed-runtime, gateway-continuation, memory-automatic, memory-learning-assertions, memory-experience, browser-long-page, phone-observation-boundaries, phone-sensitive-owner, agent-preferences, aion-core, aion-mcp-skills, aion-office, aion-conversations, remote-transport, aion-team-catalog, magpie-work-profile, native-operation-event, browser-document-download, browser-native-sequence, retained-development-admission]
  push:
    branches: [main]
    # Keep the production-input contract in tools/tests/test_apk_workflow_paths.py in sync.
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/build.gradle'
      - 'app/gradle.lockfile'
      - 'app/src/main/**'
      - 'app/src/pendingAdb/java/**'
      - 'display-helper/src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      - 'tools/build.sh'
      - 'tools/build-display-helper.sh'
      - 'tools/build-android-runtime.py'
      - 'tools/tests/test_apk_workflow_paths.py'
      - 'tools/tests/fixtures/apk-build-paths.json'

permissions:
  contents: read

concurrency:
  # Independent, explicitly selected host groups run on separate runners. Keep
  # serialization within each group and APK build without canceling active work.
  group: pocketworld-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.target == 'host-tests' && format('host-{0}', inputs.host_group) || 'apk' }}
  cancel-in-progress: false

jobs:
  apk:
    if: ${{ github.event.repository.private && (github.event_name != 'workflow_dispatch' || inputs.target != 'host-tests') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check production build trigger contract
        run: python3 -B -m unittest discover -s tools/tests -p test_apk_workflow_paths.py -v

      - name: Prepare pinned Android and native toolchains
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          : "${ANDROID_HOME:?Android SDK is required}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"
          # The runner's defaults change; install the versions declared by this project.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          for tool in curl make patch ninja; do command -v "$tool"; done
          # CMake 3.31.6 is an upstream pin, not the SDK's similarly named 3.31.5 package.
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          lock = json.loads(pathlib.Path('app/src/main/java/dev/pocketengine/features/local/runtime/native/source-lock.json').read_text())
          cmake = lock['toolchain']['cmake']
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pocketworld-cmake'
          root.mkdir(parents=True, exist_ok=True)
          archive = root / 'cmake.tar.gz'
          subprocess.run(['curl', '--fail', '--location', '--proto', '=https', '--proto-redir', '=https', '--tlsv1.2', '--retry', '3', '--output', str(archive), cmake['url']], check=True)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == cmake['sha256'], 'CMake source-lock mismatch'
          with tarfile.open(archive) as bundle:
              bundle.extractall(root, filter='data')
          home = root / ('cmake-' + cmake['version'] + '-linux-x86_64')
          subprocess.run([str(home / 'bin/cmake'), '--version'], check=True)
          pathlib.Path('local.properties').write_text('sdk.dir=' + os.environ['ANDROID_HOME'] + '\ncmake.dir=' + str(home) + '\n')
          with open(os.environ['GITHUB_PATH'], 'a') as path:
              path.write(str(home / 'bin') + '\n')
          PY

      - name: Assemble installable debug APK
        run: |
          set -euo pipefail
          # Online cold build: no workstation paths, private cache, signing secret, or skipped native task.
          ./gradlew --no-daemon --no-parallel --max-workers=1 --console=plain \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.vfs.watch=false :app:assembleDebug 2>&1 | tee build-artifacts/build.log

      - name: Apply stable project signing key
        env:
          POCKETWORLD_SIGNING_KEYSTORE_B64: ${{ secrets.POCKETWORLD_SIGNING_KEYSTORE_B64 }}
          POCKETWORLD_SIGNING_PASSWORD: ${{ secrets.POCKETWORLD_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "$POCKETWORLD_SIGNING_KEYSTORE_B64" || { echo 'Project signing keystore is not configured'; exit 1; }
          test -n "$POCKETWORLD_SIGNING_PASSWORD" || { echo 'Project signing password is not configured'; exit 1; }
          SIGNING_DIR=$(mktemp -d "$RUNNER_TEMP/pocketworld-signing.XXXXXX")
          export SIGNING_DIR
          trap 'rm -rf -- "$SIGNING_DIR"' EXIT
          python3 - <<'PY_SIGNING'
          import base64, os, pathlib
          value = base64.b64decode(os.environ.pop('POCKETWORLD_SIGNING_KEYSTORE_B64'), validate=True)
          target = pathlib.Path(os.environ['SIGNING_DIR']) / 'project.p12'
          target.write_bytes(value)
          target.chmod(0o600)
          PY_SIGNING
          unset POCKETWORLD_SIGNING_KEYSTORE_B64
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$SIGNING_DIR/project.p12" --ks-type PKCS12 --ks-key-alias pocketworld \
            --ks-pass env:POCKETWORLD_SIGNING_PASSWORD --key-pass env:POCKETWORLD_SIGNING_PASSWORD \
            --v4-signing-enabled false "$APK"
          unset POCKETWORLD_SIGNING_PASSWORD

      - name: Verify signed APK and packaged native payloads
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee build-artifacts/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK" > build-artifacts/alignment.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > build-artifacts/package.txt
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, zipfile
          apk = pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          catalog = json.loads(pathlib.Path('app/src/main/assets/runtime/catalog.json').read_text())
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None, 'APK ZIP integrity failed'
              names = set(z.namelist())
              for path in ('AndroidManifest.xml', 'classes.dex', 'assets/pocketengine-display-helper.jar', 'lib/arm64-v8a/libpocketprocess.so'):
                  assert path in names, 'Missing APK entry: ' + path
              for name, key in (('libproot.so', 'prootSha256'), ('libloader.so', 'loaderSha256')):
                  data = z.read('lib/arm64-v8a/' + name)
                  assert hashlib.sha256(data).hexdigest() == catalog['engine'][key], 'Packaged runtime hash mismatch: ' + name
              for path in names:
                  if path.startswith('lib/') and path.endswith('.so'):
                      assert path.startswith('lib/arm64-v8a/'), 'Unexpected native ABI: ' + path
                      data = z.read(path)
                      assert data[:4] == b'\x7fELF' and data[4] == 2 and int.from_bytes(data[18:20], 'little') == 183, 'Not AArch64 ELF: ' + path
              with zipfile.ZipFile(io.BytesIO(z.read('assets/pocketengine-display-helper.jar'))) as helper:
                  assert helper.testzip() is None and 'classes.dex' in helper.namelist(), 'Display helper DEX missing'
          certificate_sha256 = 'b58e014e2a2e49b2e85ebd5b47a034a28cb0d313d71f379a5208d21afe388e58'
          signature = pathlib.Path('build-artifacts/signature.txt').read_text()
          signer_digests = [line.split(':', 1)[1].strip().lower().replace(':', '') for line in signature.splitlines() if 'certificate SHA-256 digest:' in line]
          assert signer_digests == [certificate_sha256], 'APK signer differs from the pinned project certificate'
          badging = pathlib.Path('build-artifacts/package.txt').read_text()
          assert "package: name='dev.pocketengine'" in badging
          assert "sdkVersion:'30'" in badging
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          receipt = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'apk': 'app-debug.apk', 'bytes': apk.stat().st_size, 'sha256': digest, 'application_id': 'dev.pocketengine', 'abi': 'arm64-v8a', 'minimum_android_api': 30, 'signature': 'stable PocketWorld project key', 'certificate_sha256': certificate_sha256, 'validation': ['assembleDebug', 'APK signature', 'ZIP alignment', 'APK CRC', 'native ABI and catalog hashes', 'display helper DEX'], 'device_install_or_runtime_test': 'not performed'}
          pathlib.Path('build-artifacts/apk-identity.json').write_text(json.dumps(receipt, indent=2) + '\n')
          pathlib.Path('build-artifacts/SHA256SUMS').write_text(digest + '  app-debug.apk\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Private debug APK\n\nCommit: `' + receipt['commit'] + '`\n\nSHA256: `' + digest + '`\n\nARM64 / Android 11+. Download the APK artifact below.\n\nStable project signing: future builds with the same certificate can update compatible installations. Old temporary-debug-key installations are not migrated automatically. Private signing material is not uploaded as an artifact or cached. Build verification is not a device/runtime acceptance.\n')
          PY
          cp "$APK" build-artifacts/app-debug.apk
          cp app/build/generated/android-runtime/native-build-receipt.json build-artifacts/native-build-receipt.json

      - name: Retain private APK and verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocketworld-debug-arm64-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Retain failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocketworld-build-failure-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-artifacts/*.log
          if-no-files-found: ignore
          retention-days: 7

  host-tests:
    # Manual, bounded, single-group verification. Never add this to every APK push.
    if: ${{ github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.target == 'host-tests' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HOST_TEST_GROUP: ${{ inputs.host_group }}
      POCKETWORLD_HOST_GRADLE_JVMARGS: '-Xmx3072m -Dfile.encoding=UTF-8'
    steps:
      - name: Check out selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check lightweight build and host CLI contracts
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tools/tests -p test_apk_workflow_paths.py -v
          python3 -B -m unittest discover -s tools/tests -p test_host_tests.py -v
          if [[ "$HOST_TEST_GROUP" == browser-long-page ]]; then
            python3 -B -m unittest discover -s tools/tests -p test_browser_long_page_entrypoint.py -v
          fi

      - name: Prepare declared Android compile toolchains
        run: |
          set -euo pipefail
          mkdir -p build-artifacts/host-tests
          : "${ANDROID_HOME:?Android SDK is required}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-host-tests" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-host-tests" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          # AGP config uses the declared NDK even though no Android native build runs.
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          {
            java -version
            python3 --version
            if [[ "$HOST_TEST_GROUP" == managed-runtime ]]; then node --version; c++ --version; fi
          } > build-artifacts/host-tests/tool-versions.txt 2>&1

      - name: Require actual Chromium for bounded DOM expression tests
        if: ${{ inputs.host_group == 'browser-expression' }}
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME_BIN" ]]; then echo 'Real Chrome/Chromium is required; no renderer test will be skipped.' >&2; exit 1; fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version >> build-artifacts/host-tests/tool-versions.txt

      - name: Run the selected original host test bodies
        run: |
          set -euo pipefail
          python3 -B tools/host-tests.py --group "$HOST_TEST_GROUP" --online \
            --output build-artifacts/host-tests 2>&1 | tee build-artifacts/host-tests/host-tests.log

      - name: Prepare official isolated Chromium fixture runtime
        if: ${{ inputs.host_group == 'browser-long-page' }}
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pocketworld-playwright-browsers"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/pocketworld-playwright/node_modules/playwright"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_MODULE=$PLAYWRIGHT_MODULE" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/pocketworld-playwright" --ignore-scripts --no-audit --no-fund \
            --registry https://registry.npmjs.org playwright@1.57.0
          "$RUNNER_TEMP/pocketworld-playwright/node_modules/.bin/playwright" install --with-deps chromium
          node --version
          npm --version

      - name: Check out fixed pre-fix source for the real Chromium red case
        if: ${{ inputs.host_group == 'browser-long-page' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: afba870564e83034339ad084c2e7247260ea0c9c
          path: .browser-long-page-baseline
          persist-credentials: false

      - name: Run original emitted long-DOM Chromium red and green fixtures
        if: ${{ inputs.host_group == 'browser-long-page' }}
        run: |
          set -euo pipefail
          python3 -B tools/browser-long-page.py --report-root build-artifacts/host-tests \
            --baseline-source .browser-long-page-baseline/app/src/main/java/dev/pocketengine/browser/BrowserSemanticRead.java \
            2>&1 | tee build-artifacts/host-tests/browser-long-page.log

      - name: Retain selected host results, exact classpath and failure log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocketworld-host-${{ inputs.host_group }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build-artifacts/host-tests/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 7
