name: Mika capability checks
on:
  push:
    branches: [work/mika-53-capabilities-20261102]
    paths: ['app/**', 'display-helper/**', 'gradle/**', '*.gradle', 'tools/*mika*', '.github/workflows/mika-capability-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mika-capabilities-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targeted:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the declared Android compilation platform
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Compile and test the changed capability boundaries
        shell: bash
        run: |
          bash tools/run-mika-focused.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mika-focused-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
